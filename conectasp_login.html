<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Conecta SP</title>
    <link rel="stylesheet" href="conectasp_login.css">
</head>
<body>
    <main class="container">
       
        <article class="coluna-esquerda">
            <div class="logo">
            <h1 >Conecta SP</h1>
            </div>
            <h2 class="titulo-boas-vindas">SP para todos</h2>
            <p class="titulo-boas-vindas">Cultura, lazer e turismo sem barreiras.</p>
            <h3 class="titulo-boas-vindas">Bem-vindo(a)!</h3>
            <p class="titulo-boas-vindas">Faça login para acessar conteúdos personalizados e salvar seus locais favoritos.</p>
            <img src="foto_login.png">
        </article>
        <hr>
        <section class="coluna-direita">
            <article class="card-login">
            <h2>Entrar na sua conta</h2>
            <form>
                <label for="email">E-mail ou CPF</label>
                <br>
                <input type="text" id="email" name="email" placeholder="Digite seu e-mail ou CPF" >
                <br><br>
                <div class="campo-senha">
                <label>Senha</label>
                <br>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha">
                </div>
                <div id="message"></div>
                <p> <a href="#">Esqueceu sua senha?</a></p>
                <button type="submit" class="entrar">Entrar</button>
            </form>
            <p class="texto-cadastro"> Não tem uma conta? <a href="#">Cadastre-se</a> </p>
            <p class="divisor">ou</p>
            <button type="button" class="botao-social"> Entrar com Google </button>
            <br><br>
            </article>
        </section>
    </main>
    <script src="conectasp_login.js"></script>
</body>
</html>
